<!doctype html>
<html lang="en" data-motion="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Send option · Take 2</title>
<meta name="robots" content="noindex">
<!-- The Send (design A, Leader: Wajih's pick) at the foot of a filled work slip, with the page's own stylesheets: shown in a
     phone-size frame on the asset sheet (assets.html). Taps here never leave the page: they show the link instead. -->
<link rel="stylesheet" href="../css/site.css?v=e8d0bd4807">
<link rel="stylesheet" href="../css/page-02.css?v=aab3ce8db6">
<link rel="stylesheet" href="../css/page-03-send.css?v=3b799356aa">
<link rel="stylesheet" href="../css/page-03.css?v=83ed324d2b">
<style>
  html, body { background: var(--paper); }
  body { overflow-x: hidden; }
  .p3 { padding: 16px 0 24px; min-height: 100vh; }
  .slip { border-top: 1px solid var(--ink); }
  .lab-said { margin: 14px 16px 0; font-family: var(--f-mono); font-size: 10px; line-height: 1.5; color: var(--graphite); word-break: break-all; }
</style>
</head>
<body>
<section class="p3 p23">
  <form class="slip" id="slip" novalidate>
    <div class="slip__sec slip__sec--needs">
      <h3 class="slip__q"><span class="slip__no mono" aria-hidden="true">A</span><span>What you need</span></h3>
      <ol class="slip__needs"><li><span class="n mono">01</span><span class="t">A website</span></li><li><span class="n mono">02</span><span class="t">AI working for me</span></li></ol>
    </div>
    <fieldset class="slip__sec slip__sec--by">
      <legend class="slip__q"><span class="slip__no mono" aria-hidden="true">E</span><span>Send it by</span></legend>
      <div class="slip__ticks slip__ticks--by">
        <label class="tick"><input type="radio" name="by" value="whatsapp" checked><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect x=".5" y=".5" width="23" height="23"/><path d="M4.5 19.5 19.5 4.5" pathLength="1"/></svg><span>WhatsApp</span></label>
        <label class="tick"><input type="radio" name="by" value="email"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect x=".5" y=".5" width="23" height="23"/><path d="M4.5 19.5 19.5 4.5" pathLength="1"/></svg><span>Email</span></label>
        <label class="tick"><input type="radio" name="by" value="call"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect x=".5" y=".5" width="23" height="23"/><path d="M4.5 19.5 19.5 4.5" pathLength="1"/></svg><span>Phone call</span></label>
        <label class="tick"><input type="radio" name="by" value="page"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect x=".5" y=".5" width="23" height="23"/><path d="M4.5 19.5 19.5 4.5" pathLength="1"/></svg><span>From this page</span></label>
        <label class="tick"><input type="radio" name="by" value="book"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect x=".5" y=".5" width="23" height="23"/><path d="M4.5 19.5 19.5 4.5" pathLength="1"/></svg><span>Book a call</span></label>
      </div>
    </fieldset>
    <div class="slip__send">
      <a class="send" href="#">
        <span class="send__k mono"><span class="js-send-k">By WhatsApp</span></span>
        <span class="send__row"><span class="send__w display js-send-w">Send</span><svg class="send__arrow" aria-hidden="true" preserveAspectRatio="none"><line class="send__shaft" x1="0" y1="50%" x2="100%" y2="50%"/></svg><svg class="send__head" viewBox="0 0 22 12" aria-hidden="true"><path d="M0 2 22 6 0 10Z"/></svg></span>
        <span class="send__say js-send-say">Opens WhatsApp with this slip filled in.</span>
      </a>
    </div>
  </form>
  <p class="lab-said" aria-live="polite"></p>
</section>
<script type="module">
  import { WAYS } from '../js/page02/send.js';
  import { slip } from '../js/page02/slip.js';
  const a = document.querySelector('.send'), said = document.querySelector('.lab-said');
  a.classList.add('send--a');
  slip.setNeed('web', true); slip.setNeed('ai', true); slip.set('when', 'In 1–3 months'); slip.set('name', 'Khalid');
  const paint = () => { const w = WAYS[slip.by](); a.querySelector('.js-send-k').textContent = w.k; a.querySelector('.js-send-w').textContent = w.w; a.querySelector('.js-send-say').textContent = w.say; return w; };
  document.getElementById('slip').addEventListener('change', (e) => { if (e.target.name === 'by') { slip.set('by', e.target.value); paint(); } });
  a.addEventListener('click', (e) => { e.preventDefault(); const w = paint(); said.textContent = `Would open: ${w.href || '(posts the slip from the page)'}`; });
  paint();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Style lab · Take 2</title>
<meta name="robots" content="noindex">
<script type="importmap">
{ "imports": { "three": "../vendor/three/three.module.min.js", "three/addons/": "../vendor/three/addons/" } }
</script>
<link rel="preload" href="../fonts/newsreader-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/dm-mono-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="lab/lab.css">
</head>
<body>
  <!-- the first tap: the breathing point (it also unlocks vibration) -->
  <div id="enter" class="enter" role="dialog" aria-label="Enter the style lab">
    <button class="enter__point" type="button" aria-label="Tap the point to enter"><i></i></button>
    <p class="enter__hint mono">Tap the point <span class="ph-tag">placeholder</span></p>
    <p class="enter__note mono">Style lab · Take 2 · one option per screen</p>
  </div>

  <header class="bar">
    <span class="bar__title mono">Style lab · Take 2</span>
    <nav class="bar__groups" aria-label="Groups"></nav>
    <span class="bar__ph mono">All words are placeholders</span>
    <span class="bar__fps mono" id="fps" aria-hidden="true">— fps</span>
  </header>

  <main id="lab" class="lab" aria-label="Style options"></main>

  <script type="module" src="lab/lab.js"></script>
</body>
</html>

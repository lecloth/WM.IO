<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone stills · Take 2</title>
<meta name="robots" content="noindex">
<!-- Renders the still for the corridor's frame 4: the two real phones (iPhone 18 Pro Max, Galaxy S26 Ultra) running our
     booking app, front on, orthographic (so the blueprint's lines, site/js/page01/corridor-drawings.js, match the photo
     exactly), on a transparent ground, in the same studio light as phone A. Driven by tools/phone_stills.py, which
     saves site/media/phones-unverified/corridor-phones.webp (git-ignored: licences unverified, local only) and prints
     the measured outlines. Shows "file missing" without the models. -->
<script type="importmap">
{ "imports": { "three": "../vendor/three/three.module.min.js", "three/addons/": "../vendor/three/addons/" } }
</script>
<link rel="preload" href="../fonts/newsreader-var.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Newsreader"; src: url(../fonts/newsreader-var.woff2) format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "DM Mono"; src: url(../fonts/dm-mono-500.woff2) format("woff2"); font-weight: 500; }
  @font-face { font-family: "DM Mono"; src: url(../fonts/dm-mono-400.woff2) format("woff2"); font-weight: 400; }
  html, body { margin: 0; background: #F2F0EB; font: 14px "DM Mono", monospace; }
  canvas { display: block; max-width: 100%; height: auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<p id="say"></p>
<script type="module">
import * as THREE from 'three';
import { loadPhone, studio, appTexture, setScreen } from '../js/phones/realphones.js';
import { PHONE_PAIR } from '../js/page01/corridor-drawings.js';
await document.fonts.ready;
await document.fonts.load('500 20px "DM Mono"'); await document.fonts.load('400 20px Newsreader');
const W = +(new URLSearchParams(location.search).get('w') || 1200);
const { gap, pad } = PHONE_PAIR;
const canvas = document.getElementById('c');
const r = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setPixelRatio(1); r.setClearColor(0, 0); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1;
const scene = new THREE.Scene(); scene.environment = await studio(r, '../');
const phones = await Promise.all(['iphone18', 's26'].map((k) => loadPhone(k, { base: '../' })));
if (phones.some((p) => p.missing)) { document.getElementById('say').textContent = 'file missing: ' + phones.filter((p) => p.missing).map((p) => p.key).join(', '); window.__still = { missing: true }; }
else {
  const app = appTexture();
  const [a, b] = phones;
  a.obj.position.x = -(gap / 2 + a.size.x / 2); b.obj.position.x = gap / 2 + b.size.x / 2;
  phones.forEach((p) => { setScreen(p, app); scene.add(p.obj); p.obj.updateMatrixWorld(true); });
  const x0 = -(gap / 2 + a.size.x + pad), x1 = gap / 2 + b.size.x + pad, hh = Math.max(a.size.y, b.size.y) / 2 + pad;
  const H = Math.round(W * (2 * hh) / (x1 - x0));
  r.setSize(W, H, false);
  const cam = new THREE.OrthographicCamera(x0, x1, hh, -hh, 1, 1000); cam.position.set(0, 0, 400); cam.lookAt(0, 0, 0);
  r.render(scene, cam);
  // measure: each phone's outline (bbox, corner radius from the rendered silhouette) and its screen (mesh bbox), in mm
  const g = r.getContext(), px = new Uint8Array(W * H * 4); g.readPixels(0, 0, W, H, g.RGBA, g.UNSIGNED_BYTE, px);
  const alpha = (x, y) => px[((H - 1 - y) * W + x) * 4 + 3];
  const mm = (x1 - x0) / W, toPx = (x, y) => [(x - x0) / mm, (hh - y) / mm];
  const out = phones.map((p) => {
    const bb = new THREE.Box3().setFromObject(p.obj), sb = p.screen ? new THREE.Box3().setFromObject(p.screen) : null;
    // the corner radius: walk the diagonal in from the outline's top-left corner to the first opaque pixel
    const [cx, cy] = toPx(bb.min.x, bb.max.y); let t = 0;
    while (t < 400 && alpha(Math.round(cx + t), Math.round(cy + t)) < 128) t++;
    const rad = t * Math.SQRT2 / (Math.SQRT2 - 1) * mm;
    return { key: p.key, x: +bb.min.x.toFixed(2), y: +bb.min.y.toFixed(2), w: +(bb.max.x - bb.min.x).toFixed(2), h: +(bb.max.y - bb.min.y).toFixed(2), r: +rad.toFixed(2),
      screen: sb && { x: +sb.min.x.toFixed(2), y: +sb.min.y.toFixed(2), w: +(sb.max.x - sb.min.x).toFixed(2), h: +(sb.max.y - sb.min.y).toFixed(2) } };
  });
  window.__still = { region: { x0, x1, y0: -hh, y1: hh }, size: [W, H], phones: out, webp: canvas.toDataURL('image/webp', 0.9) };
}
window.__done = true;
</script>
</body>
</html>

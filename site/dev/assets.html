<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asset sheet · Take 2</title>
<meta name="robots" content="noindex">
<script type="importmap">
{ "imports": { "three": "../vendor/three/three.module.min.js", "three/addons/": "../vendor/three/addons/" } }
</script>
<link rel="preload" href="../fonts/newsreader-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/dm-mono-500.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Newsreader"; src: url(../fonts/newsreader-var.woff2) format("woff2"); font-weight: 200 800; font-display: swap; }
  @font-face { font-family: "DM Mono"; src: url(../fonts/dm-mono-400.woff2) format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "DM Mono"; src: url(../fonts/dm-mono-500.woff2) format("woff2"); font-weight: 500; font-display: swap; }
  :root { --paper: #F2F0EB; --ink: #121212; --graphite: #6B6A66; --hair: rgba(18,18,18,.55); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font-family: Newsreader, Georgia, serif; font-size: 18px; line-height: 1.4; }
  .mono { font-family: "DM Mono", ui-monospace, monospace; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  header { padding: 24px 16px 8px; max-width: 1240px; margin: 0 auto; }
  header h1 { font-weight: 420; font-size: 34px; line-height: 1.1; letter-spacing: -.015em; margin-top: 8px; }
  header p { max-width: 60ch; margin-top: 10px; }
  .turn { display: flex; align-items: center; gap: 14px; margin-top: 18px; }
  .turn input { flex: 1; max-width: 360px; accent-color: var(--ink); height: 32px; }
  .sheet { display: grid; grid-template-columns: repeat(auto-fit, 384px); justify-content: center; gap: 24px; padding: 16px 0 48px; }
  .card { width: 384px; max-width: 100vw; }
  .card__stage { position: relative; height: 734px; max-height: 92vh; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair);
    background: #E9DDC6 url(../media/paper/miller-1905-paper.webp) 0 0 / 560px repeat; }
  .card canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .card__tag { position: absolute; left: 16px; top: 14px; }
  .card__pend { position: absolute; right: 16px; top: 14px; color: var(--graphite); }
  .card h2 { font-weight: 420; font-size: 26px; line-height: 1.15; padding: 12px 16px 0; }
  .card p { padding: 4px 16px 0; }
  .card dl { padding: 10px 16px 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; }
  .card dt { color: var(--graphite); padding-top: 3px; }
  .card dd { font-size: 16px; }
  a { color: inherit; text-underline-offset: 3px; }
  footer { max-width: 1240px; margin: 0 auto; padding: 0 16px 48px; color: var(--graphite); }
  @media (max-width: 420px) { .sheet { grid-template-columns: 1fr; gap: 32px; } .card { width: 100%; } }
</style>
</head>
<body>
  <header>
    <p class="mono">Asset sheet · Take 2 · page 1 · the phone, real stage</p>
    <h1>Three materials for the finished phone</h1>
    <p>Every map is a CC0 scan from ambientCG. The band and the back change; the screen, glass and lenses stay. Page 1 uses A until you pick.</p>
    <label class="turn mono">Turn <input id="turn" type="range" min="-100" max="100" value="11" aria-label="Turn the phones"></label>
  </header>
  <main class="sheet" id="sheet"></main>
  <footer class="mono">Sources and licences: CREDITS.md · converted by tools/materials.py</footer>
<script type="module" src="assets.js"></script>
</body>
</html>

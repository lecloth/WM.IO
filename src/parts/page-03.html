    <!-- PAGE 03: THE WORK SLIP (the lab's C3). Its head is page 2's last line (docked); then the printed needs, when,
         your name, anything else, how to send, and Send. WhatsApp and email open in the visitor's own app with the slip
         filled in; sending from the page and booking are built but switched off in site/js/settings.js (off: they hand
         over to the email app). Then "or see how we think", and Detail B, a circle that grows into page 4.
         Every line is a DRAFT until Wajih signs it off. Script: site/js/page02/slip.js, send.js, callout.js -->
    <section id="page-03" class="p3 p23" data-sheet="03" data-title="Work slip" data-drawn="Engineering" data-checked="Design" data-approved="Strategy" aria-label="Page 3: your work slip">
      <form class="slip" id="slip" novalidate autocomplete="on" aria-label="Work slip">
        <div class="slip__sec g-snap slip__sec--needs">
          <h3 class="slip__q gt g-snap"><span class="slip__no mono" aria-hidden="true">A</span><span data-draft>What you need</span></h3>
          <ol class="slip__needs"></ol>
          <p class="slip__empty gt gt-h" data-draft><a href="#page-02">Nothing yet. Tap what fits, above ↑</a></p>
        </div>
        <fieldset class="slip__sec g-snap slip__sec--when">
          <legend class="slip__q gt g-snap"><span class="slip__no mono" aria-hidden="true">B</span><span data-draft>When do you need it?</span></legend>
          <div class="slip__ticks">
            <label class="tick g-snap"><input type="radio" name="when" value="As soon as possible"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect x=".5" y=".5" width="23" height="23"/><path d="M4.5 19.5 19.5 4.5"/></svg><span data-draft>As soon as possible</span></label>
            <label class="tick g-snap"><input type="radio" name="when" value="In 1–3 months"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect x=".5" y=".5" width="23" height="23"/><path d="M4.5 19.5 19.5 4.5"/></svg><span data-draft>In 1–3 months</span></label>
            <label class="tick g-snap"><input type="radio" name="when" value="Just exploring"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect x=".5" y=".5" width="23" height="23"/><path d="M4.5 19.5 19.5 4.5"/></svg><span data-draft>Just exploring</span></label>
          </div>
        </fieldset>
        <div class="slip__sec g-snap slip__sec--name">
          <label class="slip__q gt g-snap" for="slip-name"><span class="slip__no mono" aria-hidden="true">C</span><span data-draft>Your name</span></label>
          <input class="slip__field" id="slip-name" name="name" type="text" maxlength="60" autocomplete="name" autocapitalize="words" spellcheck="false" enterkeyhint="next">
        </div>
        <div class="slip__sec g-snap slip__sec--note">
          <label class="slip__q gt g-snap" for="slip-note"><span class="slip__no mono" aria-hidden="true">D</span><span data-draft>Anything else?</span> <span class="slip__opt mono" data-draft>Optional</span></label>
          <textarea class="slip__field slip__field--box" id="slip-note" name="note" rows="3" maxlength="500" aria-describedby="slip-note-n"></textarea>
          <span class="slip__count mono gt gt-h" id="slip-note-n" aria-live="off"><b class="js-note-n">0</b> / 500</span>
        </div>
        <fieldset class="slip__sec g-snap slip__sec--by">
          <legend class="slip__q gt g-snap"><span class="slip__no mono" aria-hidden="true">E</span><span data-draft>Send it by</span></legend>
          <div class="slip__ticks slip__ticks--by">
            <label class="tick g-snap"><input type="radio" name="by" value="whatsapp" checked><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect x=".5" y=".5" width="23" height="23"/><path d="M4.5 19.5 19.5 4.5"/></svg><span data-draft>WhatsApp</span></label>
            <label class="tick g-snap"><input type="radio" name="by" value="email"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect x=".5" y=".5" width="23" height="23"/><path d="M4.5 19.5 19.5 4.5"/></svg><span data-draft>Email</span></label>
            <label class="tick g-snap"><input type="radio" name="by" value="call"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect x=".5" y=".5" width="23" height="23"/><path d="M4.5 19.5 19.5 4.5"/></svg><span data-draft>Phone call</span></label>
            <label class="tick g-snap"><input type="radio" name="by" value="page"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect x=".5" y=".5" width="23" height="23"/><path d="M4.5 19.5 19.5 4.5"/></svg><span data-draft>From this page</span></label>
            <label class="tick g-snap"><input type="radio" name="by" value="book"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect x=".5" y=".5" width="23" height="23"/><path d="M4.5 19.5 19.5 4.5"/></svg><span data-draft>Book a call</span></label>
          </div>
          <!-- booking (only when settings.booking.on): the next working days' slots, in the visitor's own time -->
          <div class="slip__slots" hidden>
            <p class="slip__slots-k mono gt gt-h" data-draft>Pick a slot · your time</p>
            <div class="slip__slots-grid" role="radiogroup" aria-label="Call slots"></div>
          </div>
        </fieldset>
        <!-- honeypot: people never see or reach it; a bot that fills it is quietly dropped (from-page and booking only) -->
        <div class="slip__hp" aria-hidden="true"><label>Leave this empty <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
        <div class="slip__send g-snap">
          <a class="send send--a" href="#" data-by="whatsapp">
            <span class="send__k mono gt gt-h"><span class="js-send-k" data-draft>By WhatsApp</span></span>
            <span class="send__row"><span class="send__w display gt js-send-w" data-draft>Send</span><svg class="send__arrow" aria-hidden="true" preserveAspectRatio="none"><line class="send__shaft" x1="0" y1="50%" x2="100%" y2="50%"/></svg><svg class="send__head" viewBox="0 0 22 12" aria-hidden="true"><path d="M0 2 22 6 0 10Z"/></svg></span>
            <span class="send__say gt gt-h js-send-say" data-draft>Opens WhatsApp with this slip filled in.</span>
          </a>
          <p class="slip__said gt gt-h" role="status" aria-live="polite"></p>
        </div>
      </form>
      <!-- the way on: a line, then Detail B (a circle) with page 4 already behind it; it grows into page 4's stage -->
      <div class="p3__tail">
        <div class="p3__pin">
          <p class="p3__more rv gt"><a href="#page-04" data-draft>or see how we think ↓</a></p>
        </div>
      </div>
      <div class="p3-callout" aria-hidden="true">
        <svg class="p3-callout__svg"><circle class="p3-callout__c" cx="0" cy="0" r="1"/><path class="p3-callout__lead"/></svg>
        <span class="p3-callout__tag mono" data-draft>Detail B · 04 Trips</span>
      </div>
    </section>
